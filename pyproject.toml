[project]
name = "wigix"
version = "0.2.3"
description = "Open-source Linux driver and dashboard for the G.SKILL WigiDash"
readme = "README.md"
keywords = ["wigix", "gskill", "dashboard", "homelab", "usb", "home-assistant"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Topic :: System :: Monitoring", "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = ["pyusb", "pillow", "numpy", "pyyaml", "psutil", "requests", "websocket-client",
                "icalendar>=6", "recurring-ical-events>=3", "paho-mqtt>=2"]

[project.scripts]
wigix = "wigix.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wigix = ["editor_ui/*", "tray_icons/*.png"]

[project.optional-dependencies]
dev = ["pytest", "websockets"]
tray = ["PyQt6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
