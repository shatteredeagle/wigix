name: appimage
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    # Ubuntu 22.04 (glibc 2.35) keeps the image running on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 fonts-dejavu-core
      - name: Build
        run: packaging/appimage/build.sh
      - name: Smoke test (no FUSE needed)
        run: |
          app=$(ls dist-appimage/wigix-*-x86_64.AppImage)
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run preview -c examples/dashboard.yaml -o preview.png
          test -s preview.png
          "$app" --appimage-extract-and-run init --udev | head -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: wigix-appimage
          path: |
            dist-appimage/*.AppImage
            dist-appimage/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wigix-appimage
      - name: Verify checksum
        run: sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.sha256
